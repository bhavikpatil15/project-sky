kind = "web"
previewPath = "/"
title = "Asteroid Watch"
version = "1.0.0"
id = "artifacts/asteroid-watch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21158

[services.development]
run = "pnpm --filter @workspace/asteroid-watch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/asteroid-watch", "run", "build" ]
publicDir = "artifacts/asteroid-watch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21158"
BASE_PATH = "/"
